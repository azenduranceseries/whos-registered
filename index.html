<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Arizona Endurance Series — Registration &amp; Results</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<style>
  :root{
    --bg:#f6f1e3;
    --bg-panel:#fffdf8;
    --bg-alt:#ece2c8;
    --text:#221a13;
    --text-dim:#6f6353;
    --gold:#c97f1e;
    --gold-bright:#a8630f;
    --sky:#1f7fb8;
    --magenta:#8a3568;
    --magenta-bright:#6e2a52;
    --caution:#e0a83c;
    --line: rgba(34,26,19,0.14);
    --line-bright: rgba(34,26,19,0.28);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(ellipse 900px 500px at 15% -10%, rgba(138,53,104,0.12), transparent 60%),
      radial-gradient(ellipse 700px 500px at 100% 0%, rgba(31,127,184,0.09), transparent 55%),
      var(--bg);
    color:var(--text);
    font-family:'IBM Plex Sans', sans-serif;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  a{color:inherit;}
  button{font-family:inherit;}

  /* ---------- header ---------- */
  header{
    padding:56px 24px 32px;
    max-width:1100px;
    margin:0 auto;
    border-bottom:1px solid var(--line);
  }
  .brand-row{
    display:flex;
    align-items:flex-start;
    gap:22px;
    margin-bottom:18px;
  }
  .brand-row img{
    width:64px;
    height:auto;
    flex:0 0 auto;
    filter:drop-shadow(0 4px 14px rgba(34,26,19,0.18));
  }
  .eyebrow{
    font-family:'IBM Plex Mono', monospace;
    font-size:12px;
    letter-spacing:0.16em;
    text-transform:uppercase;
    color:var(--sky);
    margin:0 0 14px;
  }
  h1{
    font-family:'Anton', sans-serif;
    font-weight:400;
    font-size:clamp(28px, 5.4vw, 48px);
    line-height:1.02;
    letter-spacing:0.01em;
    margin:0 0 16px;
    text-transform:uppercase;
  }
  h1 span{color:var(--magenta-bright);}
  .sub{
    font-family:'IBM Plex Mono', monospace;
    font-size:13px;
    letter-spacing:0.04em;
    color:var(--text-dim);
    text-transform:uppercase;
    max-width:680px;
    line-height:1.7;
  }
  .sub b{color:var(--text);font-weight:600;}

  main{max-width:1100px;margin:0 auto;padding:36px 24px 80px;}

  /* ---------- hub ---------- */
  #hubView.hidden, #detailView.hidden{display:none;}

  .hub-tools{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:16px;
    margin-bottom:22px;
    flex-wrap:wrap;
  }
  .hub-tools .count{
    font-family:'IBM Plex Mono', monospace;
    font-size:12px;
    color:var(--text-dim);
    letter-spacing:0.05em;
    text-transform:uppercase;
  }
  #eventSearch{
    background:var(--bg-panel);
    border:1px solid var(--line-bright);
    color:var(--text);
    padding:10px 14px;
    font-family:'IBM Plex Mono', monospace;
    font-size:13px;
    min-width:220px;
  }
  #eventSearch::placeholder{color:var(--text-dim);}
  #eventSearch:focus{outline:none;border-color:var(--gold-bright);}

  .hub-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(240px,1fr));
    gap:1px;
    background:var(--line);
    border:1px solid var(--line);
  }
  .event-card{
    background:var(--bg-panel);
    padding:18px 20px 18px;
    text-align:left;
    cursor:pointer;
    border:none;
    color:var(--text);
    display:flex;
    flex-direction:column;
    gap:14px;
    transition:background .15s ease;
    min-height:118px;
  }
  .event-card:hover{background:var(--bg-alt);}
  .card-top{display:flex;align-items:center;gap:12px;}
  .card-logo{
    width:46px;
    height:46px;
    flex:0 0 auto;
    object-fit:contain;
    background:var(--bg-alt);
    border:1px solid var(--line);
  }
  .card-logo.placeholder{
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:'Anton', sans-serif;
    font-size:16px;
    color:var(--text-dim);
  }
  .event-card .ename{
    font-family:'IBM Plex Sans', sans-serif;
    font-weight:600;
    font-size:15.5px;
    line-height:1.3;
  }
  .event-card .emeta{
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    color:var(--text-dim);
    text-transform:uppercase;
    letter-spacing:0.03em;
  }
  .card-bottom{
    margin-top:auto;
    display:flex;
    justify-content:space-between;
    align-items:center;
  }
  .badge{
    font-family:'IBM Plex Mono', monospace;
    font-size:10.5px;
    letter-spacing:0.06em;
    text-transform:uppercase;
    padding:4px 8px;
    border:1px solid var(--line-bright);
    color:var(--text-dim);
  }
  .badge.open{color:var(--sky);border-color:rgba(63,166,223,0.5);}
  .badge.low{color:var(--gold-bright);border-color:rgba(245,184,78,0.5);}
  .badge.full{color:var(--text);background:var(--caution);border-color:var(--caution);}
  .card-arrow{color:var(--text-dim);font-family:'IBM Plex Mono', monospace;font-size:14px;}

  /* ---------- detail view ---------- */
  .back-link{
    display:inline-flex;
    align-items:center;
    gap:6px;
    background:none;
    border:none;
    color:var(--text-dim);
    font-family:'IBM Plex Mono', monospace;
    font-size:12px;
    letter-spacing:0.06em;
    text-transform:uppercase;
    cursor:pointer;
    padding:0 0 20px;
  }
  .back-link:hover{color:var(--gold-bright);}

  .race-head{
    margin-bottom:8px;
    display:flex;
    align-items:center;
    gap:18px;
  }
  .race-head-logo{
    width:64px;
    height:64px;
    flex:0 0 auto;
    object-fit:contain;
    background:var(--bg-panel);
    border:1px solid var(--line);
  }
  .race-head h2{
    font-family:'Anton', sans-serif;
    font-weight:400;
    font-size:clamp(26px,4.2vw,38px);
    text-transform:uppercase;
    margin:0 0 6px;
    letter-spacing:0.01em;
  }
  .race-meta{
    font-family:'IBM Plex Mono', monospace;
    font-size:12.5px;
    color:var(--text-dim);
    letter-spacing:0.03em;
  }

  .subtabs{
    display:flex;
    gap:2px;
    margin:26px 0 26px;
    border-bottom:1px solid var(--line);
  }
  .subtab-btn{
    background:none;
    border:none;
    color:var(--text-dim);
    font-family:'IBM Plex Sans', sans-serif;
    font-weight:600;
    font-size:13.5px;
    text-transform:uppercase;
    letter-spacing:0.03em;
    padding:10px 4px;
    margin-right:26px;
    cursor:pointer;
    position:relative;
  }
  .subtab-btn:hover{color:var(--text);}
  .subtab-btn.active{color:var(--text);}
  .subtab-btn.active::after{
    content:"";
    position:absolute;left:0;right:0;bottom:-1px;height:2px;
    background:var(--gold-bright);
  }
  .subpanel{display:none;}
  .subpanel.active{display:block;animation:fade .25s ease;}
  @keyframes fade{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:translateY(0);}}

  /* ---------- climb bar ---------- */
  .climb{
    border:1px solid var(--line);
    background:var(--bg-panel);
    padding:20px 22px 16px;
    margin-bottom:32px;
  }
  .climb-top{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    margin-bottom:12px;
    font-family:'IBM Plex Mono', monospace;
  }
  .climb-count{font-size:22px;font-weight:600;color:var(--text);}
  .climb-count small{font-size:12px;color:var(--text-dim);font-weight:400;}
  .climb-status{font-size:11.5px;letter-spacing:0.1em;text-transform:uppercase;padding:4px 9px;border:1px solid var(--line-bright);}
  .climb-status.open{color:var(--sky);border-color:rgba(63,166,223,0.5);}
  .climb-status.low{color:var(--gold-bright);border-color:rgba(245,184,78,0.5);}
  .climb-status.full{color:var(--text);background:var(--caution);border-color:var(--caution);}
  .climb-track{
    position:relative;
    height:22px;
    background:repeating-linear-gradient(90deg, var(--bg-alt) 0 9.9%, rgba(34,26,19,0.05) 9.9% 10%);
    overflow:hidden;
  }
  .climb-fill{height:100%;background:linear-gradient(90deg, var(--sky), var(--magenta));transition:width .5s ease;}
  .climb-fill.full{background:repeating-linear-gradient(135deg, var(--caution) 0 10px, #1c1710 10px 20px);}
  .climb-cap-line{position:absolute;top:-3px;bottom:-3px;right:0;width:2px;background:var(--text);opacity:0.5;}
  .climb-ticks{display:flex;justify-content:space-between;font-family:'IBM Plex Mono', monospace;font-size:9.5px;color:var(--text-dim);margin-top:6px;letter-spacing:0.05em;}

  .roster-label{
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    letter-spacing:0.14em;
    text-transform:uppercase;
    color:var(--text-dim);
    margin:0 0 14px;
    border-bottom:1px solid var(--line);
    padding-bottom:10px;
  }
  .roster-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(210px,1fr));
    gap:1px;
    background:var(--line);
    border:1px solid var(--line);
  }
  .rider{background:var(--bg);padding:12px 14px;display:flex;justify-content:space-between;align-items:baseline;gap:8px;}
  .rider .rname{font-size:13.5px;font-weight:500;}
  .rider .rcity{font-family:'IBM Plex Mono', monospace;font-size:10.5px;color:var(--text-dim);text-transform:uppercase;white-space:nowrap;text-align:right;}

  /* ---------- results ---------- */
  .year-pills{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:22px;}
  .year-pill{
    background:var(--bg-panel);
    border:1px solid var(--line-bright);
    color:var(--text-dim);
    font-family:'IBM Plex Mono', monospace;
    font-size:12.5px;
    letter-spacing:0.04em;
    padding:8px 16px;
    cursor:pointer;
  }
  .year-pill:hover{color:var(--text);}
  .year-pill.active{background:var(--magenta);border-color:var(--magenta);color:var(--text);}

  .results-table{width:100%;border-collapse:collapse;border:1px solid var(--line);}
  .results-table th{
    font-family:'IBM Plex Mono', monospace;
    font-size:10.5px;
    letter-spacing:0.1em;
    text-transform:uppercase;
    color:var(--text-dim);
    text-align:left;
    padding:10px 14px;
    border-bottom:1px solid var(--line-bright);
    background:var(--bg-panel);
  }
  .results-table td{
    padding:10px 14px;
    border-bottom:1px solid var(--line);
    font-size:13.5px;
  }
  .results-table tr:last-child td{border-bottom:none;}
  .results-table td.place{font-family:'IBM Plex Mono', monospace;color:var(--gold-bright);font-weight:600;}
  .results-table td.time{font-family:'IBM Plex Mono', monospace;text-align:right;color:var(--text-dim);}
  .results-table td.cat{font-family:'IBM Plex Mono', monospace;font-size:11px;color:var(--text-dim);text-transform:uppercase;}

  .state-msg{
    font-family:'IBM Plex Mono', monospace;
    font-size:13px;
    color:var(--text-dim);
    padding:30px 4px;
    text-align:center;
    border:1px dashed var(--line-bright);
  }
  .state-msg.err{color:var(--gold-bright);}

  footer{
    max-width:1100px;
    margin:0 auto;
    padding:26px 24px 50px;
    border-top:1px solid var(--line);
    font-family:'IBM Plex Mono', monospace;
    font-size:11.5px;
    color:var(--text-dim);
    letter-spacing:0.02em;
    line-height:1.8;
  }
  footer a{color:var(--gold-bright);text-decoration:none;border-bottom:1px solid rgba(245,184,78,0.4);}
</style>
</head>
<body>

<header>
  <div class="brand-row">
    <img src="assets/aes-logo.png" alt="Arizona Endurance Series logo">
    <div>
      <h1>Arizona<br>Endurance<span> Series</span></h1>
    </div>
  </div>
</header>

<main>
  <div id="hubView">
    <div class="hub-tools">
      <span class="count" id="hubCount"></span>
      <input type="text" id="eventSearch" placeholder="Search events…">
    </div>
    <div class="hub-grid" id="hubGrid"></div>
  </div>

  <div id="detailView" class="hidden">
    <button class="back-link" id="backBtn">← All events</button>
    <div class="race-head" id="raceHead">
      <h2 id="detailName"></h2>
      <div class="race-meta" id="detailMeta"></div>
    </div>
    <div class="subtabs">
      <button class="subtab-btn active" id="subtabReg">Who's Registered</button>
      <button class="subtab-btn" id="subtabRes">Results</button>
    </div>

    <div class="subpanel active" id="panelReg">
      <div class="climb" id="climbBox"></div>
      <p class="roster-label">Registered riders</p>
      <div id="rosterBox"><div class="state-msg">Loading roster…</div></div>
    </div>

    <div class="subpanel" id="panelRes">
      <div id="yearPillsBox" class="year-pills"></div>
      <div id="resultsBox"><div class="state-msg">Select a year.</div></div>
    </div>
  </div>
</main>

<script>
/* =====================================================================
   CONFIG — one entry per event. Add results years as they become
   available; leave the results array empty for brand-new events.

   registration.csvUrl / results[].csvUrl come from:
     Google Sheet -> File -> Share -> Publish to web -> pick the sheet/tab
     -> CSV -> Publish. Paste the link in.
   ===================================================================== */
function slugify(s){
  return s.toLowerCase().trim().replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,'');
}

const RAW_EVENTS = [
  "Antelope Peak Challenge",
  "Gila 100 Stage Bikepack",
  "Tortolita 50",
  "West Siiide Series",
  "Ripsey",
  "Sedona Big Friggin Loop",
  "Coronado Gold",
  "Prescott Monstercross",
  "Pinyons & Pines Bikepack",
  "Aspen Asphyxiation",
  "Kaibab Stage Bikepack",
  "Tusayan Tussle",
  "Mogollon Mayhem",
  "Coconino Stage Bikepack",
  "Kentucky Camp",
  "Picketpost Punisher",
  "Pleasantville"
];

const LOGOS = {
  "tortolita-50": "assets/events/tortolita-50.png",
  "antelope-peak-challenge": "assets/events/antelope-peak-challenge.png",
  "gila-100-stage-bikepack": "assets/events/gila-100-stage-bikepack.png",
  "ripsey": "assets/events/ripsey.png",
  "sedona-big-friggin-loop": "assets/events/sedona-big-friggin-loop.png",
  "coronado-gold": "assets/events/coronado-gold.png",
  "prescott-monstercross": "assets/events/prescott-monstercross.png",
  "aspen-asphyxiation": "assets/events/aspen-asphyxiation.png",
  "kaibab-stage-bikepack": "assets/events/kaibab-stage-bikepack.png",
  "tusayan-tussle": "assets/events/tusayan-tussle.png",
  "mogollon-mayhem": "assets/events/mogollon-mayhem.png",
  "kentucky-camp": "assets/events/kentucky-camp.png",
  "coconino-stage-bikepack": "assets/events/coconino-stage-bikepack.png",
  "picketpost-punisher": "assets/events/picketpost-punisher.png",
  "pinyons-pines-bikepack": "assets/events/pinyons-pines-bikepack.jpeg"
  // west-siiide-series and pleasantville: no logo uploaded yet.
};

// One shared CSV for ALL events' registration rosters: the "Who's Registered?"
// tab of the 2026 Registrations workbook, published to web (File > Share >
// Publish to web > select "Who's Registered?" sheet > CSV > Publish).
// This tab has one NAME column per event, with a HOMETOWN column immediately
// to its right (position-based, header text doesn't matter).
const REGISTRATION_CSV_URL = "PASTE_WHOS_REGISTERED_CSV_LINK_HERE";

// Substring (lowercase) used to find each event's column in the header row.
// Keep these distinct enough that they won't accidentally match another event.
const EVENT_ALIASES = {
  "antelope-peak-challenge": "antelope peak",
  "tortolita-50": "tortolita",
  "gila-100-stage-bikepack": "gila",
  "west-siiide-series": "west siiide",
  "ripsey": "ripsey",
  "sedona-big-friggin-loop": "sedona",
  "coronado-gold": "coronado",
  "prescott-monstercross": "prescott",
  "aspen-asphyxiation": "aspen",
  "kaibab-stage-bikepack": "kaibab",
  "tusayan-tussle": "tusayan",
  "mogollon-mayhem": "mogollon",
  "coconino-stage-bikepack": "coco",
  "kentucky-camp": "kentucky",
  "picketpost-punisher": "picketpost",
  "pleasantville": "pleasant"
};

const EVENTS = RAW_EVENTS.map(name => {
  const id = slugify(name);
  return {
    id: id,
    name: name,
    date: "Date TBD",
    location: "Location TBD",
    logo: LOGOS[id] || null,
    registration: {
      capacity: 74
    },
    // Add one object per year of results you have, most recent first.
    // Example: { year: 2026, csvUrl: "https://docs.google.com/.../pub?output=csv" }
    results: []
  };
});

const NAME_KEYS = ["name","full name","your name","rider name","participant name"];
const CITY_KEYS = ["city","hometown","where are you from","home town","location","from"];
const PLACE_KEYS = ["place","pos","position","rank","finish place"];
const TIME_KEYS = ["time","finish time","elapsed","finish","result"];
const CATEGORY_KEYS = ["category","division","class","age group","gender","field"];
const BLOCK_KEYS = ["email","e-mail","phone","cell","mobile","emergency","contact","address"];

function findKey(headers, wants){
  const lower = headers.map(h => h.trim().toLowerCase());
  for(const want of wants){
    const i = lower.indexOf(want);
    if(i !== -1) return headers[i];
  }
  for(const want of wants){
    const i = lower.findIndex(h => h.includes(want));
    if(i !== -1) return headers[i];
  }
  return null;
}
function escapeHtml(str){
  const d = document.createElement('div');
  d.textContent = str == null ? '' : str;
  return d.innerHTML;
}

let currentEvent = null;
const resultsCache = {}; // eventId|year -> rows

// Parsed once, shared by every event: { eventId: [{name, city}, ...] }
let registrationGrid = null;
let registrationLoadPromise = null;

function loadRegistrationGrid(){
  if(registrationLoadPromise) return registrationLoadPromise;
  registrationLoadPromise = new Promise((resolve) => {
    if(!REGISTRATION_CSV_URL || REGISTRATION_CSV_URL.indexOf('PASTE_') === 0){
      registrationGrid = {};
      resolve(registrationGrid);
      return;
    }
    Papa.parse(REGISTRATION_CSV_URL, {
      download:true, header:false, skipEmptyLines:false,
      complete: function(results){
        const rows = results.data;
        const headers = (rows[0] || []).map(h => (h || '').toLowerCase());
        const grid = {};
        Object.keys(EVENT_ALIASES).forEach(eventId => {
          const alias = EVENT_ALIASES[eventId];
          const colIndex = headers.findIndex(h => h.includes(alias));
          const riders = [];
          if(colIndex !== -1){
            for(let r = 1; r < rows.length; r++){
              const name = (rows[r][colIndex] || '').trim();
              if(!name) continue;
              const city = (rows[r][colIndex + 1] || '').trim();
              riders.push({ name, city });
            }
          }
          grid[eventId] = riders;
        });
        registrationGrid = grid;
        resolve(grid);
      },
      error: function(){
        registrationGrid = {};
        resolve(registrationGrid);
      }
    });
  });
  return registrationLoadPromise;
}

/* ---------------- HUB ---------------- */
function buildHub(){
  const grid = document.getElementById('hubGrid');
  document.getElementById('hubCount').textContent = EVENTS.length + ' EVENTS';
  grid.innerHTML = '';
  EVENTS.forEach(ev => {
    const card = document.createElement('button');
    card.className = 'event-card';
    card.dataset.id = ev.id;
    card.innerHTML = `
      <div class="card-top">
        ${ev.logo
          ? `<img class="card-logo" src="${ev.logo}" alt="${escapeHtml(ev.name)} logo">`
          : `<div class="card-logo placeholder">${escapeHtml(ev.name.charAt(0))}</div>`}
        <div>
          <div class="ename">${escapeHtml(ev.name)}</div>
          <div class="emeta">${escapeHtml(ev.date)}</div>
        </div>
      </div>
      <div class="card-bottom">
        <span class="badge" id="badge-${ev.id}">…</span>
        <span class="card-arrow">→</span>
      </div>`;
    card.addEventListener('click', () => openEvent(ev.id));
    grid.appendChild(card);
  });
  loadRegistrationGrid().then(grid => {
    EVENTS.forEach(ev => {
      const el = document.getElementById('badge-' + ev.id);
      const riders = grid[ev.id];
      if(!riders){
        el.textContent = 'Not connected';
        return;
      }
      const cap = ev.registration.capacity;
      const remaining = cap - riders.length;
      el.textContent = riders.length + ' / ' + cap;
      el.className = 'badge ' + (remaining <= 0 ? 'full' : remaining <= 10 ? 'low' : 'open');
    });
  });
}

document.getElementById('eventSearch').addEventListener('input', (e) => {
  const q = e.target.value.trim().toLowerCase();
  document.querySelectorAll('.event-card').forEach(card => {
    const name = card.querySelector('.ename').textContent.toLowerCase();
    card.style.display = name.includes(q) ? '' : 'none';
  });
});

/* ---------------- DETAIL ---------------- */
function openEvent(id, subtab){
  const ev = EVENTS.find(e => e.id === id);
  if(!ev) return;
  currentEvent = ev;
  location.hash = id + (subtab === 'results' ? '/results' : '');

  document.getElementById('hubView').classList.add('hidden');
  document.getElementById('detailView').classList.remove('hidden');
  document.getElementById('detailName').textContent = ev.name;
  document.getElementById('detailMeta').textContent = ev.date + ' · ' + ev.location;

  const headEl = document.getElementById('raceHead');
  const existingLogo = headEl.querySelector('.race-head-logo');
  if(existingLogo) existingLogo.remove();
  if(ev.logo){
    const img = document.createElement('img');
    img.className = 'race-head-logo';
    img.src = ev.logo;
    img.alt = ev.name + ' logo';
    headEl.prepend(img);
  }

  showSubtab(subtab === 'results' ? 'results' : 'reg');
}

function closeEvent(){
  currentEvent = null;
  history.replaceState(null, '', location.pathname + location.search);
  document.getElementById('detailView').classList.add('hidden');
  document.getElementById('hubView').classList.remove('hidden');
}

document.getElementById('backBtn').addEventListener('click', closeEvent);

document.getElementById('subtabReg').addEventListener('click', () => showSubtab('reg'));
document.getElementById('subtabRes').addEventListener('click', () => showSubtab('results'));

function showSubtab(which){
  const isReg = which === 'reg';
  document.getElementById('subtabReg').classList.toggle('active', isReg);
  document.getElementById('subtabRes').classList.toggle('active', !isReg);
  document.getElementById('panelReg').classList.toggle('active', isReg);
  document.getElementById('panelRes').classList.toggle('active', !isReg);
  if(!currentEvent) return;
  if(isReg){
    loadRegistration(currentEvent);
  } else {
    buildYearPills(currentEvent);
  }
}

/* ---------------- registration panel ---------------- */
function renderClimb(count, capacity){
  const pct = Math.min(100, (count / capacity) * 100);
  const full = count >= capacity;
  const remaining = Math.max(0, capacity - count);
  let statusClass = 'open', statusText = 'Open';
  if(full){ statusClass = 'full'; statusText = 'Full'; }
  else if(remaining <= 10){ statusClass = 'low'; statusText = remaining + ' left'; }

  document.getElementById('climbBox').innerHTML = `
    <div class="climb-top">
      <div class="climb-count">${count} <small>/ ${capacity} registered</small></div>
      <div class="climb-status ${statusClass}">${statusText}</div>
    </div>
    <div class="climb-track">
      <div class="climb-fill ${full ? 'full' : ''}" style="width:${pct}%"></div>
      <div class="climb-cap-line"></div>
    </div>
    <div class="climb-ticks"><span>0</span><span>${Math.round(capacity/2)}</span><span>${capacity} (cap)</span></div>
  `;
}

function loadRegistration(ev){
  const rosterEl = document.getElementById('rosterBox');
  if(!REGISTRATION_CSV_URL || REGISTRATION_CSV_URL.indexOf('PASTE_') === 0){
    rosterEl.innerHTML = `<div class="state-msg err">Registration sheet not connected yet — add the "Who's Registered?" published CSV link in the config.</div>`;
    renderClimb(0, ev.registration.capacity);
    return;
  }
  rosterEl.innerHTML = `<div class="state-msg">Loading roster…</div>`;
  loadRegistrationGrid().then(grid => {
    const riders = grid[ev.id] || [];
    renderClimb(riders.length, ev.registration.capacity);
    if(riders.length === 0){
      rosterEl.innerHTML = `<div class="state-msg">No one's signed up yet — be the first.</div>`;
      return;
    }
    rosterEl.innerHTML = `<div class="roster-grid">` + riders.map(r =>
      `<div class="rider"><span class="rname">${escapeHtml(r.name)}</span><span class="rcity">${escapeHtml(r.city)}</span></div>`
    ).join('') + `</div>`;
  });
}

/* ---------------- results panel ---------------- */
function buildYearPills(ev){
  const box = document.getElementById('yearPillsBox');
  const resultsBox = document.getElementById('resultsBox');
  if(!ev.results || ev.results.length === 0){
    box.innerHTML = '';
    resultsBox.innerHTML = `<div class="state-msg">No results archived for this event yet.</div>`;
    return;
  }
  const years = ev.results.slice().sort((a,b) => b.year - a.year);
  box.innerHTML = years.map((y,i) =>
    `<button class="year-pill ${i===0?'active':''}" data-year="${y.year}">${y.year}</button>`
  ).join('');
  box.querySelectorAll('.year-pill').forEach(btn => {
    btn.addEventListener('click', () => {
      box.querySelectorAll('.year-pill').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      loadResultsYear(ev, parseInt(btn.dataset.year,10));
    });
  });
  loadResultsYear(ev, years[0].year);
}

function loadResultsYear(ev, year){
  const box = document.getElementById('resultsBox');
  const entry = ev.results.find(r => r.year === year);
  if(!entry || !entry.csvUrl || entry.csvUrl.indexOf('PASTE_') === 0){
    box.innerHTML = `<div class="state-msg err">No results sheet connected for ${year} yet.</div>`;
    return;
  }
  const cacheKey = ev.id + '|' + year;
  box.innerHTML = `<div class="state-msg">Loading results…</div>`;
  Papa.parse(entry.csvUrl, {
    download:true, header:true, skipEmptyLines:true,
    complete: function(results){
      const headers = results.meta.fields || [];
      const nameKey = findKey(headers, NAME_KEYS);
      const placeKey = findKey(headers, PLACE_KEYS);
      const timeKey = findKey(headers, TIME_KEYS);
      const catKey = findKey(headers, CATEGORY_KEYS);
      const rows = results.data.filter(r => Object.values(r).some(v => v && v.trim && v.trim() !== ''));
      if(rows.length === 0){
        box.innerHTML = `<div class="state-msg">No results rows found for ${year}.</div>`;
        return;
      }
      box.innerHTML = `<table class="results-table"><thead><tr>
          <th>Place</th><th>Name</th><th>Category</th><th style="text-align:right">Time</th>
        </tr></thead><tbody>` +
        rows.map((r,i) => `<tr>
            <td class="place">${escapeHtml(placeKey ? r[placeKey] : (i+1))}</td>
            <td>${escapeHtml(nameKey ? r[nameKey] : '—')}</td>
            <td class="cat">${escapeHtml(catKey ? r[catKey] : '')}</td>
            <td class="time">${escapeHtml(timeKey ? r[timeKey] : '')}</td>
          </tr>`).join('') +
        `</tbody></table>`;
    },
    error: function(){
      box.innerHTML = `<div class="state-msg err">Couldn't load results for ${year}. Check that the sheet is published to the web as CSV.</div>`;
    }
  });
}

/* ---------------- boot / deep-link routing ---------------- */
buildHub();
(function routeFromHash(){
  const hash = location.hash.replace('#','');
  if(!hash) return;
  const [id, sub] = hash.split('/');
  if(EVENTS.some(e => e.id === id)) openEvent(id, sub);
})();
</script>
